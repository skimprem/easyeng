services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: easyeng
      POSTGRES_USER: easyeng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyeng -d easyeng"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://easyeng:${POSTGRES_PASSWORD}@db:5432/easyeng
    ports:
      - "${EASYENG_PORT:-8000}:8000"
    volumes:
      - appdata:/data   # кэш онлайн-словарей и загрузки
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
