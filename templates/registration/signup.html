{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block main_class %}page narrow{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Регистрация</h1>
  <form method="post">{% csrf_token %}
    {% include "_form.html" %}
    <button class="btn btn-primary wide">Создать аккаунт</button>
  </form>
  <p class="muted center">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
